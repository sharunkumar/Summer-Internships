name: Update

on:
  push:
    branches:
      - dev
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        filter: blob:none

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Add Git Commiter Details
      run: |
        git config --global user.email "sharunksplus@gmail.com"
        git config --global user.name "Sharun"

    - name: Upstream Setup & Merge
      run: |
        git remote add upstream https://github.com/SimplifyJobs/Summer2027-Internships.git
        git fetch --filter=blob:none --no-tags upstream dev
        git merge --log upstream/dev --strategy=recursive --strategy-option=ours

    # This has to be done first due to permissions reasons
    - name: Move other workflows
      run: |
        find .github/workflows/ -name '*.yml' ! -name 'update.yml' -exec git mv {} .github/archived-workflows/ \;

    - name: Commit and push
      run: |
        if [[ `git status --porcelain` ]]; then
          git commit -am "move unused workflows" && git push
        else
          echo "No changes to commit"
        fi

    - name: Update READMEs
      id: readmes
      run: |
        cp .github/template/README.md .
        cp .github/template/README-Off-Season.md .
        cp .github/template/README-Inactive.md .
        uv run python .github/scripts/update_readmes_custom.py

    - name: Set commit message (with fallback)
      id: commit_message
      run: |
        msg="${{ steps.readmes.outputs.commit_message }}"
        if [ -z "$msg" ]; then
          msg="Auto commit: update READMEs"
        fi
        echo "message=$msg" >> "$GITHUB_OUTPUT"

    - name: Commit READMEs
      run: |
        git add README.md README-Inactive.md README-Off-Season.md
        if ! git diff --cached --quiet; then
          git commit --quiet --message="${{ steps.commit_message.outputs.message }}"
        else
          echo "No changes to commit"
        fi

    - name: Push
      run: git push
